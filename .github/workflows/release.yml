name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The guide is plain markdown, so a release carries notes only.
      # The website is published by pages.yml.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
